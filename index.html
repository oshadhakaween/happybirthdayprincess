<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Princess ❤️</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
      overflow-x:hidden;
      color:white;
    }

    .hero{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      position:relative;
      padding:20px;
    }

    .glow{
      position:absolute;
      width:500px;
      height:500px;
      background:#ff4d8d;
      filter:blur(180px);
      opacity:0.25;
      border-radius:50%;
      animation:float 6s ease-in-out infinite;
    }

    @keyframes float{
      0%,100%{transform:translateY(0px);}
      50%{transform:translateY(-30px);}
    }

    .content{
      position:relative;
      z-index:2;
      max-width:800px;
    }

    h1{
      font-size:4rem;
      font-family:'Dancing Script',cursive;
      color:#ffb6d0;
      margin-bottom:10px;
      animation:fadeIn 2s ease;
    }

    h2{
      font-size:2rem;
      margin-bottom:25px;
      animation:fadeIn 2.5s ease;
    }

    p{
      font-size:1.1rem;
      line-height:1.9;
      color:#e5e7eb;
<body>

<div class="hero">
  <div class="glow"></div>

  <div class="content">
    <h1>Happy Birthday</h1>
    <h2>My Little Princess ❤️</h2>

    <p>
      Today is all about you.
      Your smile, your happiness, and the beautiful soul that makes my life brighter every single day.
      I hope this year brings you endless happiness, unforgettable memories, and everything your heart wishes for.
    </p>

    <a href="#message" class="btn">Open My Message</a>
  </div>
</div>

<section class="message" id="message">
  <h3>For You ❤️</h3>

  <p>
    Thank you for being the most special person in my life.
    No matter where life takes us, I will always cherish every moment, every laugh, and every memory with you.
  </p>

  <p>
    I hope your birthday is as beautiful as your heart.
    Keep smiling, princess. ✨
  </p>
</section>

<div class="footer">
  Made with love by Oshadha ❤️
</div>

<script>
  function createHeart(){
    const heart=document.createElement('div');
    heart.classList.add('heart');
    heart.innerHTML='❤';

    heart.style.left=Math.random()*100+'vw';
    heart.style.fontSize=Math.random()*20+10+'px';
    heart.style.animationDuration=Math.random()*3+3+'s';

    document.body.appendChild(heart);

    setTimeout(()=>{
      heart.remove();
    },6000);
  }

  setInterval(createHeart,300);
</script>

</body>
</html>
